<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>Azure DevOps → Branch &amp; Commit</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, Helvetica, sans-serif;
      background: #f3f4f6;
      color: #111827;
    }

    .container {
      max-width: 1000px;
      margin: 40px auto;
      padding: 0 20px;
    }

    .top-bar {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 20px;
      margin-bottom: 25px;
    }

    h1 {
      margin: 0 0 8px;
    }

    .description {
      color: #6b7280;
      margin: 0;
    }

    .language {
      display: flex;
      align-items: center;
      gap: 8px;
      white-space: nowrap;
    }

    .language select,
    .options select {
      padding: 8px 10px;
      border: 1px solid #d1d5db;
      border-radius: 6px;
      background: white;
      font-size: 14px;
    }

    .card {
      background: white;
      padding: 24px;
      border-radius: 10px;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.06);
      margin-bottom: 20px;
    }

    label {
      display: block;
      font-weight: 600;
      margin-bottom: 8px;
    }

    textarea {
      width: 100%;
      min-height: 200px;
      padding: 14px;
      border: 1px solid #d1d5db;
      border-radius: 8px;
      font-size: 14px;
      font-family: monospace;
      resize: vertical;
      outline: none;
    }

    textarea:focus {
      border-color: #2563eb;
      box-shadow: 0 0 0 2px rgba(37, 99, 235, 0.1);
    }

    .hint {
      margin-top: 8px;
      color: #9ca3af;
      font-size: 12px;
    }

    .options {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-top: 18px;
      flex-wrap: wrap;
    }

    .options label {
      margin: 0;
    }

    button {
      border: none;
      border-radius: 6px;
      padding: 10px 16px;
      background: #2563eb;
      color: white;
      font-size: 14px;
      cursor: pointer;
    }

    button:hover {
      background: #1d4ed8;
    }

    button.success {
      background: #059669;
    }

    button.success:hover {
      background: #047857;
    }

    button.copy {
      background: #374151;
      min-width: 80px;
      margin: 0;
    }

    button.copy:hover {
      background: #1f2937;
    }

    .results-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      margin-bottom: 15px;
      flex-wrap: wrap;
    }

    .header-actions {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }

    .counter {
      color: #6b7280;
      font-size: 14px;
      margin-left: 5px;
    }

    .result {
      border: 1px solid #e5e7eb;
      border-radius: 8px;
      padding: 14px;
      margin-bottom: 12px;
    }

    .output {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .output + .preview-title {
      margin-top: 14px;
    }

    .branch {
      flex: 1;
      padding: 12px;
      background: #f9fafb;
      border: 1px solid #e5e7eb;
      border-radius: 6px;
      font-family: monospace;
      font-size: 14px;
      word-break: break-all;
    }

    .branch.pending {
      color: #9ca3af;
      font-style: italic;
    }

    .error {
      color: #dc2626;
      margin-top: 12px;
      font-size: 14px;
    }

    .empty {
      color: #9ca3af;
      text-align: center;
      padding: 30px;
    }

    .preview-title {
      font-size: 12px;
      color: #6b7280;
      margin-bottom: 5px;
    }

    @media (max-width: 600px) {

      .top-bar {
        flex-direction: column;
      }

      .output {
        flex-direction: column;
        align-items: stretch;
      }

      button.copy {
        width: 100%;
      }

      .header-actions button {
        flex: 1;
      }
    }
  </style>
</head>

<body>

  <div class="container">

    <!-- HEADER -->

    <div class="top-bar">

      <div>
        <h1 id="title"></h1>
        <p id="description" class="description"></p>
      </div>

      <div class="language">

        <label
          for="language"
          id="languageLabel"
          style="margin: 0;"
        ></label>

        <select id="language">
          <option value="en">🇺🇸 English</option>
          <option value="pt">🇧🇷 Português</option>
          <option value="es">🇪🇸 Español</option>
          <option value="de">🇩🇪 Deutsch</option>
        </select>

      </div>

    </div>


    <!-- INPUT -->

    <div class="card">

      <label
        for="tickets"
        id="ticketsLabel"
      ></label>

      <textarea
        id="tickets"
      ></textarea>

      <div
        class="hint"
        id="hint"
      ></div>


      <div class="options">

        <label
          for="bugPrefix"
          id="bugPrefixLabel"
        ></label>

        <select id="bugPrefix">

          <option value="fix">
            fix/
          </option>

          <option value="bug">
            bug/
          </option>

          <option value="hotfix">
            hotfix/
          </option>

        </select>


        <button
          onclick="generateBranches()"
          id="generateButton"
        ></button>

      </div>

      <div
        id="error"
        class="error"
      ></div>

    </div>


    <!-- RESULTS -->

    <div class="card">

      <div class="results-header">

        <div>

          <strong id="resultsTitle"></strong>

          <span
            id="counter"
            class="counter"
          ></span>

        </div>


        <div
          class="header-actions"
          id="headerActions"
          style="display: none;"
        >

          <button
            id="copyAllBranchesButton"
            class="success"
            onclick="copyAll('branch')"
          ></button>

          <button
            id="copyAllCommitsButton"
            class="success"
            onclick="copyAll('commit')"
          ></button>

        </div>

      </div>


      <div id="results">

        <div
          class="empty"
          id="emptyResults"
        ></div>

      </div>

    </div>

  </div>


  <script>

    /*
     * ==========================================
     * TRANSLATIONS
     * ==========================================
     */

    const translations = {

      en: {
        title: "Azure DevOps → Branch & Commit",
        description:
          "Paste Azure DevOps ticket titles and generate branch names and squash commit messages automatically.",
        language: "Language",
        tickets: "Tickets",
        hint:
          "Branch name and squash commit are generated automatically as you type.",
        bugPrefix:
          "Bug prefix:",

          "Generate",
        results:

        copyAllBranches:
          "Copy all branches",
        copyAllCommits:
          "Copy all commits",
        copied:
          "Copied!",
        copy:
          "Copy",
        branchLabel:

          "Squash commit",
        empty:

        emptyError:

      },


      pt: {
        title: "Azure DevOps → Branch e Commit",
        description:
          "Cole os títulos dos tickets do Azure DevOps e gere os nomes das branches e as mensagens de squash commit automaticamente.",
        language: "Idioma",
        tickets: "Tickets",
        hint:
          "O nome da branch e o squash commit são gerados automaticamente enquanto você digita.",
        bugPrefix:
          "Prefixo para Bug:",
        generate:
          "Gerar",
        results:

        copyAllBranches:
          "Copiar branches",
        copyAllCommits:
          "Copiar commits",
        copied:

        copy:
          "Copiar",
        branchLabel:
          "Branch",
        commitLabel:
          "Squash commit",
        empty:
          "Comece a digitar um ticket acima.",
        emptyError:
          "Digite pelo menos um ticket.",
        countOne:
          "ticket",
        countMany:
          "tickets",
        pending:
          "Aguardando o formato do ticket...",
        placeholder:
`Funcionalidade 941: Impedir valor negativo no primeiro item da transação
Bug 940: Desconto no nível da transação

História de Usuário 938: Melhorar experiência de checkout`
      },


      es: {
        title: "Azure DevOps → Branch y Commit",
        description:
          "Pegue los títulos de los tickets de Azure DevOps y genere automáticamente los nombres de las branches y los mensajes de squash commit.",
        language: "Idioma",
        tickets: "Tickets",
        hint:
          "El nombre de la branch y el squash commit se generan automáticamente mientras escribe.",
        bugPrefix:
          "Prefijo para Bug:",
        generate:
          "Generar",
        results:
          "Nombres generados",
        copyAllBranches:
          "Copiar branches",
        copyAllCommits:
          "Copiar commits",
        copied:
          "¡Copiado!",
        copy:
          "Copiar",
        branchLabel:
          "Branch",
        commitLabel:
          "Squash commit",
        empty:
          "Comience a escribir un ticket arriba.",
        emptyError:
          "Ingrese al menos un ticket.",
        countOne:
          "ticket",
        countMany:
          "tickets",
        pending:
          "Esperando el formato del ticket...",
        placeholder:
`Funcionalidad 941: Evitar valor negativo en el primer elemento de la transacción
Error 940: Descuento a nivel de transacción
Tarea 939: Actualizar validación de la transacción
Historia de Usuario 938: Mejorar experiencia de checkout`
      },


      de: {
        title: "Azure DevOps → Branch & Commit",
        description:
          "Fügen Sie Azure-DevOps-Ticket-Titel ein und erstellen Sie automatisch Branch-Namen und Squash-Commit-Nachrichten.",
        language: "Sprache",
        tickets: "Tickets",
        hint:
          "Branch-Name und Squash-Commit werden automatisch während der Eingabe generiert.",
        bugPrefix:
          "Bug-Präfix:",
        generate:
          "Generieren",
        results:
          "Generierte Namen",
        copyAllBranches:
          "Alle Branches kopieren",
        copyAllCommits:
          "Alle Commits kopieren",
        copied:
          "Kopiert!",
        copy:
          "Kopieren",
        branchLabel:
          "Branch",
        commitLabel:
          "Squash-Commit",
        empty:
          "Beginnen Sie oben mit der Eingabe eines Tickets.",
        emptyError:
          "Geben Sie mindestens ein Ticket ein.",
        countOne:
          "Ticket",
        countMany:
          "Tickets",
        pending:
          "Warte auf das Ticket-Format...",
        placeholder:
`Feature 941: Negativen Wert beim ersten Transaktionsartikel verhindern
Fehler 940: Transaktionsrabatt über benutzerdefinierte Aktion
Aufgabe 939: Transaktionsvalidierung aktualisieren
Benutzergeschichte 938: Checkout-Erfahrung verbessern`
      }

    };


    /*
     * ==========================================
     * TICKET TYPES
     * ==========================================
     */

    const ticketTypes = {

      userStory: [
        "user story",
        "história de usuário",
        "historia de usuario",
        "benutzergeschichte"
      ],

      feature: [
        "feature",
        "funcionalidade",
        "funcionalidad"
      ],

      bug: [
        "bug",
        "error",
        "fehler"
      ],

      task: [
        "task",
        "tarefa",
        "tarea",
        "aufgabe"
      ]

    };


    /*
     * ==========================================
     * STATE
     * ==========================================
     */

    let currentLanguage = "en";

    let generatedBranches = [];

    let generatedCommits = [];


    /*
     * ==========================================
     * DOM
     * ==========================================
     */

    const languageSelect =
      document.getElementById("language");

    const ticketsInput =
      document.getElementById("tickets");


    /*
     * ==========================================
     * LANGUAGE CHANGE
     * ==========================================
     */

    languageSelect.addEventListener(
      "change",
      function() {

        currentLanguage = this.value;

        updateInterface();

        /*
         * Regenera os resultados para atualizar
         * os textos de estado/cópia.
         */
        generateBranches();

      }
    );


    /*
     * ==========================================
     * REAL-TIME GENERATION
     * ==========================================
     */

    ticketsInput.addEventListener(
      "input",
      function() {

        generateBranches();

      }
    );


    /*
     * ==========================================
     * UPDATE INTERFACE
     * ==========================================
     */

    function updateInterface() {

      const t =
        translations[currentLanguage];


      document.documentElement.lang =
        currentLanguage;


      document.getElementById(
        "title"
      ).textContent =
        t.title;


      document.getElementById(
        "description"
      ).textContent =
        t.description;


      document.getElementById(
        "languageLabel"
      ).textContent =
        t.language;


      document.getElementById(
        "ticketsLabel"
      ).textContent =
        t.tickets;


      document.getElementById(
        "hint"
      ).textContent =
        t.hint;


      document.getElementById(
        "bugPrefixLabel"
      ).textContent =
        t.bugPrefix;


      document.getElementById(
        "generateButton"
      ).textContent =
        t.generate;


      document.getElementById(
        "resultsTitle"
      ).textContent =
        t.results;


      document.getElementById(
        "copyAllBranchesButton"
      ).textContent =
        t.copyAllBranches;


      document.getElementById(
        "copyAllCommitsButton"
      ).textContent =
        t.copyAllCommits;


      document.getElementById(
        "tickets"
      ).placeholder =
        t.placeholder;

    }


    /*
     * ==========================================
     * GENERATE
     * ==========================================
     */

    function generateBranches() {

      const input =
        ticketsInput.value;

      const results =
        document.getElementById(
          "results"
        );

      const error =
        document.getElementById(
          "error"
        );

      const counter =
        document.getElementById(
          "counter"
        );

      const headerActions =
        document.getElementById(
          "headerActions"
        );

      const t =
        translations[currentLanguage];


      results.innerHTML = "";

      error.textContent = "";

      generatedBranches = [];

      generatedCommits = [];


      const validTickets =
        input
          .split("\n")
          .map(line => line.trim())
          .filter(Boolean);


      if (validTickets.length === 0) {

        results.innerHTML = `
          <div class="empty">
            ${t.empty}
          </div>
        `;

        counter.textContent = "";

        headerActions.style.display =
          "none";

        return;

      }


      /*
       * Gera branch + commit para cada ticket.
       */

      const parsed =
        validTickets.map(parseTicket);


      generatedBranches =
        parsed.map(buildBranch);

      generatedCommits =
        parsed.map(buildCommit);


      /*
       * Counter.
       */

      counter.textContent =
        `(${validTickets.length} ${
          validTickets.length === 1
            ? t.countOne
            : t.countMany
        })`;


      headerActions.style.display =
        "flex";


      /*
       * Render.
       */

      validTickets.forEach(
        (ticket, index) => {

          const pending =
            !isCompleteTicket(ticket);


          const result =
            document.createElement(
              "div"
            );

          result.className =
            "result";


          result.appendChild(
            buildOutputRow(
              t.branchLabel,
              generatedBranches[index],
              pending
            )
          );


          result.appendChild(
            buildOutputRow(
              t.commitLabel,
              generatedCommits[index],
              pending
            )
          );


          results.appendChild(
            result
          );

        }
      );

    }


    /*
     * ==========================================
     * OUTPUT ROW
     * ==========================================
     */

    function buildOutputRow(
      label,
      value,
      pending
    ) {

      const fragment =
        document.createDocumentFragment();


      const title =
        document.createElement("div");

      title.className =
        "preview-title";

      title.textContent =
        label;


      const row =
        document.createElement("div");

      row.className =
        "output";


      const valueElement =
        document.createElement("div");

      valueElement.className =
        "branch";

      if (pending) {

        valueElement.classList.add(
          "pending"
        );

      }

      valueElement.textContent =
        value;


      const copyButton =
        document.createElement(
          "button"
        );

      copyButton.className =
        "copy";

      copyButton.textContent =
        translations[
          currentLanguage
        ].copy;


      copyButton.onclick =
        async () => {

          await copyText(value);


          copyButton.textContent =
            translations[
              currentLanguage
            ].copied;


          setTimeout(() => {

            copyButton.textContent =
              translations[
                currentLanguage
              ].copy;

          }, 1500);

        };


      row.appendChild(valueElement);

      row.appendChild(copyButton);


      fragment.appendChild(title);

      fragment.appendChild(row);


      return fragment;

    }


    /*
     * ==========================================
     * PARSE TICKET
     * ==========================================
     *
     * Retorna { type, id, description }, mesmo
     * quando o ticket ainda está incompleto,
     * para que o preview continue funcionando.
     */

    function parseTicket(ticket) {

      const match =
        ticket.match(
          /^(.+?)\s+(\d+)\s*:\s*(.*)$/
        );


      if (match) {

        return {

          type: normalizeTicketType(
            match[1].trim().toLowerCase()
          ),

          id: match[2],

          description: match[3].trim()

        };

      }


      /*
       * Preview: tenta descobrir o tipo pelo
       * início da linha e o ID pelo primeiro
       * número encontrado.
       */

      const type =
        guessTicketType(ticket);


      const idMatch =
        ticket.match(/\b(\d+)\b/);


      if (idMatch) {

        const id =
          idMatch[1];


        const description =
          ticket
            .substring(
              idMatch.index + id.length
            )
            .replace(/^\s*:\s*/, "")
            .trim();


        return { type, id, description };

      }


      return {

        type,

        id: null,

        description: ticket.trim()

      };

    }


    /*
     * ==========================================
     * BUILD BRANCH
     * ==========================================
     */

    function buildBranch(ticket) {

      const prefix =
        getBranchType(ticket.type);


      const slug =
        slugify(ticket.description);


      if (!ticket.id) {

        return slug
          ? `${prefix}/${slug}`
          : `${prefix}/`;

      }


      if (!slug) {

        return `${prefix}/${ticket.id}`;

      }


      return (
        `${prefix}/` +
        `${ticket.id}-` +
        `${slug}`
      );

    }


    /*
     * ==========================================
     * BUILD COMMIT
     * ==========================================
     *
     * feat: prevent negative value [AB#941]
     */

    function buildCommit(ticket) {

      const commitType =
        getCommitType(ticket.type);


      const subject =
        toCommitSubject(
          ticket.description
        );


      const reference =
        ticket.id
          ? ` [AB#${ticket.id}]`
          : "";


      if (!subject) {

        return `${commitType}:${reference}`;

      }


      return (
        `${commitType}: ` +
        `${subject}` +
        `${reference}`
      );

    }


    /*
     * ==========================================
     * COMMIT SUBJECT
     * ==========================================
     *
     * Deixa o texto em minúsculas, mas preserva
     * siglas (API, CSV, SQL) e remove o ponto
     * final.
     */

    function toCommitSubject(text) {

      return text

        .trim()

        .replace(/\s+/g, " ")

        .replace(/[.\s]+$/, "")

        .split(" ")

        .map(word => {

          const isAcronym =
            word.length > 1 &&
            word === word.toUpperCase() &&
            /[a-zà-ÿ]/i.test(word);


          return isAcronym
            ? word
            : word.toLowerCase();

        })

        .join(" ");

    }


    /*
     * ==========================================
     * COMPLETE TICKET?
     * ==========================================
     */

    function isCompleteTicket(ticket) {

      return /^(.+?)\s+\d+\s*:\s*.+$/i
        .test(ticket);

    }


    /*
     * ==========================================
     * NORMALIZE TYPE
     * ==========================================
     */

    function normalizeTicketType(type) {

      for (
        const [
          normalizedType,
          aliases
        ] of Object.entries(
          ticketTypes
        )
      ) {

        if (aliases.includes(type)) {

          return normalizedType;

        }

      }


      return "feature";

    }


    /*
     * ==========================================
     * GUESS TYPE (PREVIEW)
     * ==========================================
     */

    function guessTicketType(ticket) {

      const normalized =
        ticket.trim().toLowerCase();


      for (
        const [
          normalizedType,
          aliases
        ] of Object.entries(
          ticketTypes
        )
      ) {

        const found =
          aliases.some(
            alias =>
              normalized.startsWith(alias)
          );


        if (found) {

          return normalizedType;

        }

      }


      return "feature";

    }


    /*
     * ==========================================
     * BRANCH TYPE
     * ==========================================
     */

    function getBranchType(type) {

      switch (type) {

        case "bug":

          return document
            .getElementById(
              "bugPrefix"
            )
            .value;


        case "task":

          return "chore";


        case "feature":

        case "userStory":

        default:

          return "feature";

      }

    }


    /*
     * ==========================================
     * COMMIT TYPE
     * ==========================================
     */

    function getCommitType(type) {

      switch (type) {

        case "bug":

          return "fix";


        case "task":

          return "chore";


        case "feature":

        case "userStory":

        default:

          return "feat";

      }

    }


    /*
     * ==========================================
     * SLUGIFY
     * ==========================================
     */

    function slugify(text) {

      return text

        .normalize("NFD")

        .replace(
          /[\u0300-\u036f]/g,
          ""
        )

        .toLowerCase()

        .replace(
          /[^a-z0-9]+/g,
          "-"
        )

        .replace(
          /-+/g,
          "-"
        )

        .replace(
          /^-+|-+$/g,
          "");

    }


    /*
     * ==========================================
     * COPY
     * ==========================================
     */

    async function copyText(text) {

      try {

        await navigator.clipboard
          .writeText(text);

      } catch (error) {

        const textarea =
          document.createElement(
            "textarea"
          );

        textarea.value =
          text;

        document.body.appendChild(
          textarea
        );

        textarea.select();

        document.execCommand(
          "copy"
        );

        textarea.remove();

      }

    }


    /*
     * ==========================================
     * COPY ALL
     * ==========================================
     */

    async function copyAll(kind) {

      const list =
        kind === "commit"
          ? generatedCommits
          : generatedBranches;


      if (list.length === 0) {

        return;

      }


      await copyText(
        list.join("\n")
      );


      const button =
        document.getElementById(
          kind === "commit"
            ? "copyAllCommitsButton"
            : "copyAllBranchesButton"
        );


      const originalKey =
        kind === "commit"
          ? "copyAllCommits"
          : "copyAllBranches";


      button.textContent =
        translations[
          currentLanguage
        ].copied;


      setTimeout(() => {

        button.textContent =
          translations[
            currentLanguage
          ][originalKey];

      }, 1500);

    }


    /*
     * ==========================================
     * BUG PREFIX CHANGE
     * ==========================================
     */

    document
      .getElementById("bugPrefix")
      .addEventListener(
        "change",
        generateBranches
      );


    /*
     * ==========================================
     * INITIALIZE
     * ==========================================
     */

    updateInterface();

    generateBranches();

  </script>

</body>
</html>
